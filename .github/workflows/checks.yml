name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint / Links / A11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージのインストール
        run: npm install --no-audit --no-fund

      - name: HTML 構文チェック
        run: npm run lint:html

      - name: CSS 構文チェック
        run: npm run lint:css

      - name: リンク切れチェック
        run: npm run lint:links

      - name: ローカルサーバー起動
        run: |
          npm run serve &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/index.html >/dev/null && break
            sleep 1
          done

      - name: アクセシビリティチェック (WCAG 2.1 A)
        run: npm run lint:a11y

      - name: SEO チェック (Lighthouse)
        run: npm run lint:seo
